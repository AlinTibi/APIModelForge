name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build frontend, vet, test, build app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # main.go embeds frontend/dist (//go:embed all:frontend/dist), and
      # that directory is gitignored build output, so it must exist with
      # at least one file before go vet/build/test can even compile the
      # main package.
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -v

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve Wails version' }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"

      - name: Build application
        run: wails build -clean -s -webview2 browser
