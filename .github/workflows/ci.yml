name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build frontend, vet, test, build app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # main.go embeds frontend/dist (//go:embed all:frontend/dist), and
      # that directory is gitignored build output, so it must exist with
      # at least one file before go vet/build/test can even compile the
      # main package.
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -v

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve Wails version' }
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"

      - name: Build application
        run: wails build -clean -s -webview2 browser
