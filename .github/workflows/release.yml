name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Windows application
        run: wails build -clean -s -webview2 browser

      - name: Go vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $package = & ./scripts/package-release.ps1 -Tag "${{ github.ref_name }}" -OutputDirectory .
          "zip_name=$($package.Zip)" >> $env:GITHUB_OUTPUT
          "checksum_name=$($package.Checksum)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "${{ steps.package.outputs.zip_name }}"
          "${{ steps.package.outputs.checksum_name }}"
          --title "API Model Forge ${{ github.ref_name }}"
          --generate-notes
